<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us - Chanukya Rakshasa Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font Awesome (for icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(to right, #00c6ff, #0072ff);
}

/* Header */
.header {
    background: #002147;
    color: white;
    text-align: center;
    padding: 15px;
}

/* Section */
.section {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

h3 {
    text-align: center;
    color: #0072ff;
}

/* Layout */
.contact-box {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

/* Left Info */
.contact-info {
    flex: 1;
}

.contact-info p {
    margin: 10px 0;
}

/* Right Form */
.contact-form {
    flex: 1;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #0072ff;
    color: white;
    border: none;
    border-radius: 5px;
    margin-top: 15px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #005bb5;
}

/* Message */
#contactMsg {
    text-align: center;
}

/* Back button */
.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: #0072ff;
}

/* Footer */
.footer {
    background: #002147;
    color: white;
    text-align: center;
    padding: 10px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
</head>

<body>

<div class="header">
    <h1>Chanukya Rakshasa Helping Portal</h1>
</div>

<div class="section">
    <h3>Contact Us</h3>

    <div class="contact-box">

        <!-- LEFT INFO -->
        <div class="contact-info">
            <h4>Get in Touch</h4>
            <p><i class="fas fa-envelope"></i> kishankishu732006@gmail.com</p>
            <p><i class="fas fa-phone"></i> +91 8123755910</p>
            <p><i class="fas fa-map-marker-alt"></i> Karnataka, India</p>
        </div>

        <!-- RIGHT FORM -->
        <div class="contact-form">
            <form id="contactForm">
                <input type="text" id="cName" placeholder="Your Name" required>
                <input type="email" id="cEmail" placeholder="Your Email" required>
                <textarea id="cMessage" rows="4" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>

            <p id="contactMsg"></p>
        </div>

    </div>

    <a href="index.html" class="back">⬅ Back to Home</a>
</div>

<div class="footer">
    © 2026 Chanukya Rakshasa Portal
</div>

<script>
// CONTACT FORM
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("cName").value;
    const email = document.getElementById("cEmail").value;
    const message = document.getElementById("cMessage").value;

    let contacts = JSON.parse(localStorage.getItem("contacts") || "[]");

    contacts.push({name, email, message});

    localStorage.setItem("contacts", JSON.stringify(contacts));

    document.getElementById("contactMsg").innerText = "✅ Message Sent Successfully!";
    document.getElementById("contactMsg").style.color = "green";

    this.reset();
});
</script>

</body>
</html>
